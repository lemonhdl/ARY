<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARY Admin · Dashboard</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <style>
      .admin-shell { display: flex; min-height: 100vh; }
      .admin-sidebar { width: 240px; background: rgba(20,49,79,0.04); border-right: 1px solid rgba(49,103,152,0.12); padding: 24px 16px; flex-shrink: 0; }
      .admin-sidebar h2 { font-size: 16px; margin: 0 0 24px; color: #14314f; letter-spacing: 0.04em; }
      .admin-sidebar nav a { display: block; padding: 10px 12px; border-radius: 10px; margin-bottom: 4px; text-decoration: none; font-size: 14px; color: #3d6d99; transition: background 0.15s; }
      .admin-sidebar nav a:hover, .admin-sidebar nav a.active { background: rgba(49,103,152,0.1); color: #14314f; font-weight: 600; }
      .admin-main { flex: 1; padding: 32px 40px; overflow-y: auto; }
      .admin-main h1 { font-size: 28px; margin: 0 0 8px; }
      .subtitle { color: #5a7a9a; font-size: 14px; margin: 0 0 32px; }
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
      .stat-card { background: rgba(255,255,255,0.85); border: 1px solid rgba(49,103,152,0.12); border-radius: 16px; padding: 20px; }
      .stat-card .label { font-size: 12px; color: #5a7a9a; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 4px; }
      .stat-card .value { font-size: 32px; font-weight: 700; color: #14314f; margin: 0; }
      .stat-card .trend { font-size: 12px; color: #5a7a9a; margin: 4px 0 0; }
      .table-wrap { background: rgba(255,255,255,0.85); border: 1px solid rgba(49,103,152,0.12); border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { text-align: left; padding: 12px 16px; background: rgba(49,103,152,0.06); font-weight: 600; color: #14314f; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      td { padding: 12px 16px; border-top: 1px solid rgba(49,103,152,0.06); color: #3d5570; }
      .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
      .badge-healthy { background: rgba(34,197,94,0.12); color: #16a34a; }
      .badge-degraded { background: rgba(234,179,8,0.12); color: #ca8a04; }
      .badge-failed { background: rgba(239,68,68,0.12); color: #dc2626; }
      .badge-stale { background: rgba(148,163,184,0.12); color: #64748b; }
      .badge-running { background: rgba(59,130,246,0.12); color: #2563eb; }
      .badge-completed { background: rgba(34,197,94,0.12); color: #16a34a; }
      .badge-registration { background: rgba(251,146,60,0.12); color: #ea580c; }
      .badge-judging { background: rgba(168,85,247,0.12); color: #9333ea; }
      .health-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .health-dot.healthy { background: #22c55e; }
      .health-dot.degraded { background: #eab308; }
      .health-dot.failed { background: #ef4444; }
      .health-dot.stale { background: #94a3b8; }
      .alert { padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
      .alert-warning { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.2); color: #92400e; }
      .section-title { font-size: 18px; margin: 24px 0 12px; color: #14314f; }
      .bar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
      .stack { display: grid; gap: 12px; margin-bottom: 24px; }
      .muted { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <h2>ARY Admin</h2>
        <nav>
          <a href="dashboard.html" class="active">📊 Dashboard</a>
          <a href="users.html">👥 用户与角色</a>
          <a href="maintenance.html">🔧 数据维护</a>
          <a href="audit-log.html">📋 审计日志</a>
          <a href="config.html">⚙️ 系统配置</a>
        </nav>
        <div style="margin-top: auto; padding-top: 32px;">
          <a href="/" style="font-size: 12px; color: #5a7a9a; text-decoration: none;">← 返回公开端</a>
        </div>
      </aside>
      <main class="admin-main">
        <h1>📊 系统运行仪表盘</h1>
        <p class="subtitle">ARY 平台全局运行状况概览 · <span id="update-time">--</span></p>

        <h2 class="section-title">平台总览</h2>
        <div class="stat-grid" id="overview-cards">加载中...</div>

        <h2 class="section-title">赛事状态分布</h2>
        <div class="stat-grid" id="race-distribution">加载中...</div>

        <h2 class="section-title">热门赛事 Top 3</h2>
        <div class="table-wrap"><table><thead><tr><th>赛事</th><th>状态</th><th>报名数</th><th>活跃骑手</th><th>已提交作品</th><th>CA 活跃率</th></tr></thead><tbody id="top-races"></tbody></table></div>

        <h2 class="section-title">CA 接入全局健康</h2>
        <div class="stat-grid" id="ca-health">加载中...</div>
        <div class="table-wrap" id="ca-anomaly-wrap" style="margin-top:16px;"><table><thead><tr><th>赛事</th><th>骑手</th><th>状态</th><th>风险 / 失败原因</th></tr></thead><tbody id="ca-anomaly-table"></tbody></table></div>

        <h2 class="section-title">Projection 状态</h2>
        <div class="table-wrap"><table><thead><tr><th>赛事</th><th>Projection 类型</th><th>健康状态</th><th>最近重建</th></tr></thead><tbody id="projection-status-table"></tbody></table></div>

        <h2 class="section-title">Report 状态</h2>
        <div class="stack" id="report-risk-list"></div>
        <div class="table-wrap"><table><thead><tr><th>赛事</th><th>Report 类型</th><th>发布状态</th><th>最近修改</th></tr></thead><tbody id="report-status-table"></tbody></table></div>
        <div id="report-reminder" style="margin-top:16px;"></div>

        <h2 class="section-title">性能指标</h2>
        <div class="table-wrap"><table><thead><tr><th>指标</th><th>当前值</th><th>目标值</th></tr></thead><tbody id="perf-table"></tbody></table></div>
      </main>
    </div>
    <script type="module">
      const statusLabels = { draft: '草稿', published: '已发布', registration: '报名中', running: '进行中', judging: '评审中', completed: '已结束', archived: '已归档', upcoming: '即将开放' };
      const statusBadges = { running: 'badge-running', judging: 'badge-judging', completed: 'badge-completed', registration: 'badge-registration', draft: 'badge-stale', published: 'badge-healthy' };
      const caStatusBadges = { active: 'badge-healthy', handshaken: 'badge-degraded', registered: 'badge-degraded', failed: 'badge-failed', not_configured: 'badge-stale', disabled: 'badge-stale' };

      async function load() {
        try {
          const resp = await fetch('/api/runtime/assembled-view');
          const data = await resp.json();
          const dash = data.dashboard || {};
          const races = data.races || [];
          const topRaces = dash.topRaces || [];
          const caRaces = data.caStatuses || [];

          document.getElementById('update-time').textContent = data.generatedAt ? new Date(data.generatedAt).toLocaleString('zh-CN') : '--';

          document.getElementById('overview-cards').innerHTML = `
            <div class="stat-card"><p class="label">总用户数</p><p class="value">${dash.totalUsers || 0}</p></div>
            <div class="stat-card"><p class="label">活跃赛事</p><p class="value">${dash.activeRaces || 0}</p></div>
            <div class="stat-card"><p class="label">总报名</p><p class="value">${dash.totalRegistrations || 0}</p></div>
            <div class="stat-card"><p class="label">CA 接入率</p><p class="value">${((dash.caIngestionRate || 0) * 100).toFixed(0)}%</p></div>
            <div class="stat-card"><p class="label">作品提交率</p><p class="value">${((dash.workSubmissionRate || 0) * 100).toFixed(0)}%</p></div>
            <div class="stat-card"><p class="label">系统健康</p><p class="value"><span class="health-dot ${dash.systemHealth || 'healthy'}"></span>${dash.systemHealth || '--'}</p></div>
          `;

          const dist = dash.raceStatusDistribution || {};
          document.getElementById('race-distribution').innerHTML = Object.entries(statusLabels).map(([key, label]) => {
            const count = dist[key] || 0;
            return `<div class="stat-card"><p class="label">${label}</p><p class="value">${count}</p></div>`;
          }).join('');

          document.getElementById('top-races').innerHTML = topRaces.map(r => `
            <tr>
              <td><strong>${r.title}</strong></td>
              <td><span class="badge ${statusBadges[r.status] || ''}">${statusLabels[r.status] || r.status}</span></td>
              <td>${r.registrations || 0}</td>
              <td>${r.activeRiders || 0}</td>
              <td>${r.submittedWorks || 0}</td>
              <td>${((r.caActiveRate || 0) * 100).toFixed(0)}%</td>
            </tr>
          `).join('') || '<tr><td colspan="6">暂无数据</td></tr>';

          const ca = dash.caHealth || {};
          document.getElementById('ca-health').innerHTML = `
            <div class="stat-card"><p class="label">总 Registration</p><p class="value">${ca.totalRegistrations || 0}</p></div>
            <div class="stat-card"><p class="label">CA 已配置</p><p class="value">${ca.configured || 0}</p></div>
            <div class="stat-card"><p class="label">CA Active</p><p class="value"><span class="health-dot healthy"></span>${ca.active || 0}</p></div>
            <div class="stat-card"><p class="label">CA Failed</p><p class="value"><span class="health-dot failed"></span>${ca.failed || 0}</p></div>
            <div class="stat-card"><p class="label">未配置 CA</p><p class="value"><span class="health-dot stale"></span>${ca.notConfigured || 0}</p></div>
          `;

          const caExceptions = caRaces.flatMap(race => (race.connections || [])
            .filter(connection => connection.flaggedAnomaly || ['failed', 'handshaken', 'registered'].includes(connection.ingestionStatus))
            .map(connection => ({
              raceTitle: race.raceTitle,
              riderName: connection.riderName,
              ingestionStatus: connection.ingestionStatus,
              note: connection.failureReason || connection.anomalyNote || '--',
              flaggedAnomaly: connection.flaggedAnomaly
            })));
          document.getElementById('ca-anomaly-table').innerHTML = caExceptions.length
            ? caExceptions.map(item => `
              <tr>
                <td><strong>${item.raceTitle}</strong></td>
                <td>${item.riderName}</td>
                <td><span class="badge ${caStatusBadges[item.ingestionStatus] || 'badge-stale'}">${item.ingestionStatus}${item.flaggedAnomaly ? ' ⚠️' : ''}</span></td>
                <td>${item.note}</td>
              </tr>`).join('')
            : '<tr><td colspan="4" style="text-align:center;color:#16a34a;">✅ 当前无接入异常</td></tr>';

          const projections = data.projectionStatuses || [];
          document.getElementById('projection-status-table').innerHTML = projections.length
            ? projections.map(p => `
              <tr>
                <td><strong>${p.raceTitle}</strong></td>
                <td>${p.projectionType}</td>
                <td><span class="badge badge-${p.health}"><span class="health-dot ${p.health}"></span>${p.health}</span></td>
                <td style="font-size:12px;">${p.lastRebuiltAt ? new Date(p.lastRebuiltAt).toLocaleString('zh-CN') : '--'}</td>
              </tr>`).join('')
            : '<tr><td colspan="4" style="text-align:center;color:#94a3b8;">暂无 Projection 数据</td></tr>';

          const reports = (data.publishedArtifacts || []).filter(a => a.artifactType === 'report');
          const reportFailures = reports.filter(r => r.publicationStatus === 'withdrawn');
          const endedButUnpublished = races
            .filter(race => ['completed', 'archived'].includes(race.status))
            .filter(race => !reports.some(report => report.raceId === race.id && report.publicationStatus === 'published'));
          document.getElementById('report-risk-list').innerHTML = [
            reportFailures.length
              ? `<div class="alert alert-warning">存在 ${reportFailures.length} 条已撤回 Report：${reportFailures.map(r => `${r.raceTitle} / ${r.reportType} / ${r.withdrawnReason || '未填写撤回原因'}`).join('；')}</div>`
              : '',
            endedButUnpublished.length
              ? `<div class="alert alert-warning">以下赛事已结束但 Report 仍未发布：${endedButUnpublished.map(r => r.title).join('、')}</div>`
              : '',
            (!reportFailures.length && !endedButUnpublished.length)
              ? '<div class="alert" style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.15);color:#166534;">当前没有未处理的 Report 风险提醒。</div>'
              : ''
          ].join('');
          document.getElementById('report-status-table').innerHTML = reports.length
            ? reports.map(r => `
              <tr>
                <td><strong>${r.raceTitle}</strong></td>
                <td>${r.reportType || '--'}</td>
                <td><span class="badge badge-${r.publicationStatus === 'published' ? 'healthy' : r.publicationStatus === 'withdrawn' ? 'failed' : 'stale'}">${r.publicationStatus}</span></td>
                <td style="font-size:12px;">${r.lastModifiedAt ? new Date(r.lastModifiedAt).toLocaleString('zh-CN') : '--'}</td>
              </tr>`).join('')
            : '<tr><td colspan="4" style="text-align:center;color:#94a3b8;">暂无 Report 数据</td></tr>';

          // Report 失败列表与未发布提醒
          const failedReports = reports.filter(r => r.publicationStatus === 'withdrawn');
          const completedRaces = (data.races || []).filter(r => r.status === 'completed');
          const unpublishedReminders = [];
          for (const race of completedRaces) {
            const raceReports = reports.filter(r => r.raceId === race.id || r.raceId === race.raceId);
            const hasPublished = raceReports.some(r => r.publicationStatus === 'published');
            if (!hasPublished && raceReports.length === 0) {
              unpublishedReminders.push({ raceTitle: race.title, raceId: race.id || race.raceId, reason: '该赛事已结束但尚未生成任何 Report' });
            } else if (!hasPublished) {
              const drafts = raceReports.filter(r => r.publicationStatus === 'draft');
              if (drafts.length) unpublishedReminders.push({ raceTitle: race.title, raceId: race.id || race.raceId, reason: `已有 ${drafts.length} 份 draft Report，但均未发布` });
            }
          }
          document.getElementById('report-reminder').innerHTML = [
            failedReports.length ? `<div class="alert alert-warning"><strong>⚠️ 失败/撤回的 Report（${failedReports.length} 份）</strong><ul style="margin:8px 0 0;padding-left:20px;">${failedReports.map(r => `<li>${r.raceTitle} — ${r.reportType} — ${r.publicationStatus} — ${r.withdrawnReason || r.failureReason || '无原因记录'}</li>`).join('')}</ul></div>` : '',
            unpublishedReminders.length ? `<div class="alert alert-warning"><strong>⚠️ 赛事已结束但 Report 未发布（${unpublishedReminders.length} 场）</strong><ul style="margin:8px 0 0;padding-left:20px;">${unpublishedReminders.map(r => `<li>${r.raceTitle} — ${r.reason}</li>`).join('')}</ul></div>` : ''
          ].join('');

          const perf = dash.performance || {};
          document.getElementById('perf-table').innerHTML = `
            <tr><td>公开页首屏响应</td><td>${perf.publicPageMs || '--'} ms</td><td>&lt; 1000 ms</td></tr>
            <tr><td>Live Hall 数据刷新</td><td>${perf.liveHallRefreshMs || '--'} ms</td><td>&lt; 3000 ms</td></tr>
            <tr><td>Screen Console 页面切换</td><td>${perf.screenPageMs || '--'} ms</td><td>&lt; 1000 ms</td></tr>
            <tr><td>GitHub 登录成功率</td><td>${perf.loginSuccessRate ? (perf.loginSuccessRate * 100).toFixed(1) + '%' : '--'}</td><td>&gt; 99%</td></tr>
            <tr><td>并发在线用户</td><td>${perf.concurrentUsers || '--'}</td><td>支持 200</td></tr>
          `;
        } catch (e) {
          document.getElementById('overview-cards').innerHTML = `<div class="alert alert-warning">加载失败：${e.message}。请确保已运行 npm run assemble。</div>`;
        }
      }
      load();
    </script>
  </body>
</html>
