<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARY Admin · 审计日志</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <style>
      .admin-shell { display: flex; min-height: 100vh; }
      .admin-sidebar { width: 240px; background: rgba(20,49,79,0.04); border-right: 1px solid rgba(49,103,152,0.12); padding: 24px 16px; flex-shrink: 0; }
      .admin-sidebar h2 { font-size: 16px; margin: 0 0 24px; color: #14314f; letter-spacing: 0.04em; }
      .admin-sidebar nav a { display: block; padding: 10px 12px; border-radius: 10px; margin-bottom: 4px; text-decoration: none; font-size: 14px; color: #3d6d99; }
      .admin-sidebar nav a:hover, .admin-sidebar nav a.active { background: rgba(49,103,152,0.1); color: #14314f; font-weight: 600; }
      .admin-main { flex: 1; padding: 32px 40px; overflow-y: auto; }
      .admin-main h1 { font-size: 28px; margin: 0 0 8px; }
      .subtitle { color: #5a7a9a; font-size: 14px; margin: 0 0 24px; }
      .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
      select { padding: 8px 14px; border: 1px solid rgba(49,103,152,0.2); border-radius: 10px; font-size: 14px; background: #fff; }
      .table-wrap { background: rgba(255,255,255,0.85); border: 1px solid rgba(49,103,152,0.12); border-radius: 16px; overflow: hidden; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { text-align: left; padding: 12px 16px; background: rgba(49,103,152,0.06); font-weight: 600; color: #14314f; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
      td { padding: 12px 16px; border-top: 1px solid rgba(49,103,152,0.06); color: #3d5570; }
      .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
      .badge-success { background: rgba(34,197,94,0.12); color: #16a34a; }
      .badge-denied { background: rgba(239,68,68,0.12); color: #dc2626; }
      .badge-failed { background: rgba(234,179,8,0.12); color: #ca8a04; }
      .detail-row { display: none; }
      .detail-row.open { display: table-row; }
      .detail-row td { background: rgba(49,103,152,0.03); font-size: 12px; color: #64748b; padding: 8px 16px 16px; font-family: monospace; white-space: pre-wrap; }
      .expand-btn { cursor: pointer; color: #2563eb; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <h2>ARY Admin</h2>
        <nav>
          <a href="dashboard.html">📊 Dashboard</a>
          <a href="users.html">👥 用户与角色</a>
          <a href="maintenance.html">🔧 数据维护</a>
          <a href="audit-log.html" class="active">📋 审计日志</a>
          <a href="config.html">⚙️ 系统配置</a>
        </nav>
        <div style="margin-top: auto; padding-top: 32px;">
          <a href="/" style="font-size: 12px; color: #5a7a9a; text-decoration: none;">← 返回公开端</a>
        </div>
      </aside>
      <main class="admin-main">
        <h1>📋 审计日志</h1>
        <p class="subtitle">平台级敏感操作记录 · <span id="log-count">--</span></p>
        <div class="toolbar">
          <select id="action-filter"><option value="">全部操作类型</option><option value="role_change">角色变更</option><option value="admin_login">管理员登录</option><option value="projection_rebuild">Projection 重算</option><option value="report_regenerate">Report 重跑</option><option value="work_visibility_change">Work 可见性变更</option><option value="profile_visibility_change">Profile 可见性变更</option><option value="config_update">配置变更</option><option value="access_denied">越权尝试</option></select>
          <select id="result-filter"><option value="">全部结果</option><option value="success">成功</option><option value="denied">拒绝</option><option value="failed">失败</option></select>
        </div>
        <div class="table-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>操作类型</th><th>目标资源</th><th>结果</th><th>详情</th></tr></thead><tbody id="log-table"></tbody></table></div>
      </main>
    </div>
    <script type="module">
      let logs = [];
      const actionLabels = { role_change:'角色变更', admin_login:'管理员登录', projection_rebuild:'Projection重算', report_regenerate:'Report重跑', work_visibility_change:'Work可见性变更', profile_visibility_change:'Profile可见性变更', config_update:'配置变更', access_denied:'越权尝试' };
      const resultBadges = { success:'badge-success', failed:'badge-failed', denied:'badge-denied' };

      async function loadLogs() {
        try {
          const resp = await fetch('/api/runtime/assembled-view');
          const data = await resp.json();
          logs = data.auditLogs || [];
          renderLogs(logs);
        } catch (e) {
          document.getElementById('log-table').innerHTML = `<tr><td colspan="6" style="color:#dc2626;">加载失败：${e.message}</td></tr>`;
        }
      }

      function filterLogs() {
        const action = document.getElementById('action-filter').value;
        const result = document.getElementById('result-filter').value;
        let filtered = logs;
        if (action) filtered = filtered.filter(l => l.actionType === action);
        if (result) filtered = filtered.filter(l => l.result === result);
        renderLogs(filtered);
      }

      function renderLogs(list) {
        document.getElementById('log-count').textContent = `共 ${list.length} 条记录`;
        if (!list.length) {
          document.getElementById('log-table').innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:40px;">暂无审计日志。请在 authority-mock.json 中补充 auditLogs。</td></tr>`;
          return;
        }
        document.getElementById('log-table').innerHTML = list.map((l, i) => `
          <tr>
            <td style="font-size:12px;white-space:nowrap;">${l.timestamp ? new Date(l.timestamp).toLocaleString('zh-CN') : '--'}</td>
            <td><strong>${l.actorGithubAccount || '--'}</strong></td>
            <td>${actionLabels[l.actionType] || l.actionType}</td>
            <td>${l.targetResourceType || '--'} / ${l.targetResourceId || '--'}</td>
            <td><span class="badge ${resultBadges[l.result] || ''}">${l.result}</span></td>
            <td><span class="expand-btn" onclick="toggleDetail(${i})">查看</span></td>
          </tr>
          <tr class="detail-row" id="detail-${i}"><td colspan="6">${JSON.stringify(l.detail, null, 2)}</td></tr>
        `).join('');
      }

      window.toggleDetail = function(i) {
        document.getElementById(`detail-${i}`).classList.toggle('open');
      };

      document.getElementById('action-filter').addEventListener('change', filterLogs);
      document.getElementById('result-filter').addEventListener('change', filterLogs);
      loadLogs();
    </script>
  </body>
</html>
