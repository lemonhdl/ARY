<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARY Admin · 用户与角色</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <style>
      .admin-shell { display: flex; min-height: 100vh; }
      .admin-sidebar { width: 240px; background: rgba(20,49,79,0.04); border-right: 1px solid rgba(49,103,152,0.12); padding: 24px 16px; flex-shrink: 0; }
      .admin-sidebar h2 { font-size: 16px; margin: 0 0 24px; color: #14314f; letter-spacing: 0.04em; }
      .admin-sidebar nav a { display: block; padding: 10px 12px; border-radius: 10px; margin-bottom: 4px; text-decoration: none; font-size: 14px; color: #3d6d99; transition: background 0.15s; }
      .admin-sidebar nav a:hover, .admin-sidebar nav a.active { background: rgba(49,103,152,0.1); color: #14314f; font-weight: 600; }
      .admin-main { flex: 1; padding: 32px 40px; overflow-y: auto; }
      .admin-main h1 { font-size: 28px; margin: 0 0 8px; }
      .subtitle { color: #5a7a9a; font-size: 14px; margin: 0 0 24px; }
      .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
      .search-input { padding: 8px 14px; border: 1px solid rgba(49,103,152,0.2); border-radius: 10px; font-size: 14px; width: 240px; background: #fff; }
      select { padding: 8px 14px; border: 1px solid rgba(49,103,152,0.2); border-radius: 10px; font-size: 14px; background: #fff; }
      .table-wrap { background: rgba(255,255,255,0.85); border: 1px solid rgba(49,103,152,0.12); border-radius: 16px; overflow: hidden; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { text-align: left; padding: 12px 16px; background: rgba(49,103,152,0.06); font-weight: 600; color: #14314f; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
      td { padding: 12px 16px; border-top: 1px solid rgba(49,103,152,0.06); color: #3d5570; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-right: 4px; }
      .badge-admin { background: rgba(239,68,68,0.12); color: #dc2626; }
      .badge-organizer { background: rgba(59,130,246,0.12); color: #2563eb; }
      .badge-judge { background: rgba(168,85,247,0.12); color: #9333ea; }
      .badge-rider { background: rgba(34,197,94,0.12); color: #16a34a; }
      .badge-none { background: rgba(148,163,184,0.12); color: #64748b; }
      .badge-complete { background: rgba(34,197,94,0.12); color: #16a34a; }
      .badge-incomplete { background: rgba(234,179,8,0.12); color: #ca8a04; }
      .btn { display: inline-block; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(49,103,152,0.2); background: #fff; color: #14314f; font-size: 12px; cursor: pointer; text-decoration: none; }
      .btn:hover { background: rgba(49,103,152,0.06); }
      .btn-primary { background: #1e4a7a; color: #fff; border-color: #1e4a7a; }
      .btn-primary:hover { background: #14314f; }
      .btn-danger { border-color: rgba(239,68,68,0.3); color: #dc2626; }
      .btn-danger:hover { background: rgba(239,68,68,0.06); }
      .role-row { display: inline-flex; gap: 4px; flex-wrap: wrap; }
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,49,79,0.4); z-index: 100; align-items: center; justify-content: center; }
      .modal-overlay.open { display: flex; }
      .modal { background: #fff; border-radius: 20px; padding: 32px; max-width: 480px; width: 90%; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
      .modal h3 { margin: 0 0 16px; font-size: 20px; }
      .modal .field { margin-bottom: 16px; }
      .modal label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #14314f; }
      .modal .checkbox-group { display: flex; gap: 16px; flex-wrap: wrap; }
      .modal .checkbox-group label { font-weight: 400; cursor: pointer; display: flex; align-items: center; gap: 4px; }
      .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <h2>ARY Admin</h2>
        <nav>
          <a href="/admin/dashboard.html">📊 Dashboard</a>
          <a href="/admin/users.html" class="active">👥 用户与角色</a>
          <a href="/admin/maintenance.html">🔧 数据维护</a>
          <a href="/admin/audit-log.html">📋 审计日志</a>
          <a href="/admin/config.html">⚙️ 系统配置</a>
        </nav>
        <div style="margin-top: auto; padding-top: 32px;">
          <a href="/" style="font-size: 12px; color: #5a7a9a; text-decoration: none;">← 返回公开端</a>
        </div>
      </aside>
      <main class="admin-main">
        <h1>👥 用户与角色管理</h1>
        <p class="subtitle">管理 ARY 平台所有用户账号和角色身份 · <span id="user-count">--</span></p>
        <div class="toolbar">
          <input type="text" class="search-input" placeholder="搜索 GitHub 账号或姓名..." id="search-input" />
          <select id="role-filter"><option value="">全部角色</option><option value="admin">admin</option><option value="organizer">organizer</option><option value="judge">judge</option><option value="rider">rider</option><option value="none">无角色</option></select>
          <select id="profile-filter"><option value="">全部资料状态</option><option value="completed">已补全</option><option value="incomplete">未补全</option></select>
        </div>
        <div class="table-wrap"><table><thead><tr><th>头像</th><th>GitHub 账号</th><th>显示名</th><th>资料</th><th>角色</th><th>注册时间</th><th>最近登录</th><th>赛事数</th><th>操作</th></tr></thead><tbody id="user-table"></tbody></table></div>
      </main>
    </div>

    <div class="modal-overlay" id="role-modal">
      <div class="modal">
        <h3>管理角色 · <span id="modal-username">--</span></h3>
        <p style="color: #5a7a9a; font-size: 13px; margin: 0 0 16px;" id="modal-github">--</p>
        <div class="field"><label>当前角色</label><div id="modal-current-roles" style="margin-top: 4px;"></div></div>
        <div class="field"><label>修改角色</label>
          <div class="checkbox-group">
            <label><input type="checkbox" value="rider" class="role-check" /> rider</label>
            <label><input type="checkbox" value="judge" class="role-check" /> judge</label>
            <label><input type="checkbox" value="organizer" class="role-check" /> organizer</label>
            <label><input type="checkbox" value="admin" class="role-check" /> admin</label>
          </div>
        </div>
        <div class="field"><label>变更原因</label><input type="text" id="modal-reason" style="width:100%;padding:8px;border:1px solid rgba(49,103,152,0.2);border-radius:8px;font-size:14px;" placeholder="必填" /></div>
        <div class="actions">
          <button class="btn" onclick="document.getElementById('role-modal').classList.remove('open')">取消</button>
          <button class="btn btn-primary" id="save-roles-btn">保存变更</button>
        </div>
      </div>
    </div>

    <script type="module">
      let users = [];
      let editingUserId = null;
      const roleBadges = { admin: 'badge-admin', organizer: 'badge-organizer', judge: 'badge-judge', rider: 'badge-rider' };

      async function loadUsers() {
        try {
          const resp = await fetch('/api/runtime/assembled-view');
          const data = await resp.json();
          users = data.userRoles || [];
          if (!users.length) {
            // Fallback: try to load from user-roles.sample.json via the runtime
            try {
              const directResp = await fetch('/api/runtime/authority-mock');
              const mock = await directResp.json();
              if (mock.userRoles) users = mock.userRoles;
            } catch (_) { /* use empty */ }
          }
          renderTable(users);
        } catch (e) {
          document.getElementById('user-table').innerHTML = `<tr><td colspan="9" style="color:#dc2626;">加载失败：${e.message}</td></tr>`;
        }
      }

      function filterUsers() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const role = document.getElementById('role-filter').value;
        const profile = document.getElementById('profile-filter').value;
        let filtered = users;
        if (search) filtered = filtered.filter(u => (u.githubAccount || '').toLowerCase().includes(search) || (u.displayName || '').toLowerCase().includes(search));
        if (role === 'none') filtered = filtered.filter(u => !u.roles || u.roles.length === 0);
        else if (role) filtered = filtered.filter(u => (u.roles || []).includes(role));
        if (profile === 'completed') filtered = filtered.filter(u => u.profileCompleted);
        else if (profile === 'incomplete') filtered = filtered.filter(u => !u.profileCompleted);
        renderTable(filtered);
      }

      function renderTable(list) {
        document.getElementById('user-count').textContent = `共 ${list.length} 人`;
        if (!list.length) {
          document.getElementById('user-table').innerHTML = `<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:40px;">暂无匹配用户。请确认 sample data 已正确装配到 assembled-view.json。</td></tr>`;
          return;
        }
        document.getElementById('user-table').innerHTML = list.map(u => `
          <tr>
            <td><img src="${u.avatarUrl || ''}" style="width:32px;height:32px;border-radius:50%;background:#e2e8f0;" onerror="this.style.display='none'" /></td>
            <td><strong>${u.githubAccount || '--'}</strong></td>
            <td>${u.displayName || '<span style="color:#94a3b8;">未设置</span>'}</td>
            <td><span class="badge ${u.profileCompleted ? 'badge-complete' : 'badge-incomplete'}">${u.profileCompleted ? '已补全' : '待补全'}</span></td>
            <td><span class="role-row">${(u.roles || []).length ? u.roles.map(r => `<span class="badge ${roleBadges[r] || ''}">${r}</span>`).join('') : '<span class="badge badge-none">未授权</span>'}</span></td>
            <td style="font-size:12px;">${u.registeredAt ? new Date(u.registeredAt).toLocaleDateString('zh-CN') : '--'}</td>
            <td style="font-size:12px;">${u.lastSignInAt ? new Date(u.lastSignInAt).toLocaleDateString('zh-CN') : '--'}</td>
            <td>${u.raceCount || 0}</td>
            <td><button class="btn btn-primary" onclick="editRoles('${u.userId}')">管理角色</button></td>
          </tr>
        `).join('');
      }

      window.editRoles = function(userId) {
        const u = users.find(x => x.userId === userId);
        if (!u) return;
        editingUserId = userId;
        document.getElementById('modal-username').textContent = u.displayName || u.githubAccount;
        document.getElementById('modal-github').textContent = u.githubAccount;
        document.getElementById('modal-current-roles').innerHTML = (u.roles || []).length ? u.roles.map(r => `<span class="badge ${roleBadges[r] || ''}">${r}</span>`).join(' ') : '<span class="badge badge-none">未授权</span>';
        document.querySelectorAll('.role-check').forEach(cb => { cb.checked = (u.roles || []).includes(cb.value); });
        document.getElementById('modal-reason').value = '';
        document.getElementById('role-modal').classList.add('open');
      };

      document.getElementById('save-roles-btn').addEventListener('click', () => {
        const newRoles = Array.from(document.querySelectorAll('.role-check:checked')).map(cb => cb.value);
        const reason = document.getElementById('modal-reason').value.trim();
        if (!reason) { alert('请填写变更原因'); return; }
        const u = users.find(x => x.userId === editingUserId);
        if (u) {
          const oldRoles = [...(u.roles || [])];
          u.roles = newRoles;
          console.log(`[Audit] role_change: ${u.githubAccount} ${JSON.stringify(oldRoles)} -> ${JSON.stringify(newRoles)} reason: ${reason}`);
        }
        document.getElementById('role-modal').classList.remove('open');
        filterUsers();
        alert(`角色已更新：${newRoles.length ? newRoles.join(', ') : '无角色'}\n原因：${reason}\n\n（注：当前为演示模式，实际变更将通过 API 持久化并写入审计日志）`);
      });

      document.getElementById('search-input').addEventListener('input', filterUsers);
      document.getElementById('role-filter').addEventListener('change', filterUsers);
      document.getElementById('profile-filter').addEventListener('change', filterUsers);

      loadUsers();
    </script>
  </body>
</html>
